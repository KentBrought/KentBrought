name: Generate full-history 3D contribution skyline

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/skyline.yml'
      - 'scripts/contribution_timeline.py'

permissions:
  contents: write

concurrency:
  group: contribution-3d
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate all-time 3D contribution city
        env:
          GITHUB_TOKEN: ${{ secrets.SKYLINE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/contribution_timeline.py
      - name: Commit generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/skyline-clean.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update full-history 3D contribution skyline"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
